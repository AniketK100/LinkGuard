<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/logo.svg" as="image" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LinkGuard is a fast URL shortener. Create custom links, vector QR codes, and track real-time click analytics." />

    <meta name="author" content="LinkGuard Engineering Team" />
    <meta name="theme-color" content="#08090B" />
    <link rel="canonical" href="https://link-guard-blond.vercel.app/" />

    <!-- Open Graph Metadata (Configured for Vercel Deployment) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LinkGuard Platform" />
    <meta property="og:title" content="LinkGuard — Fast & Secure URL Shortener" />
    <meta property="og:description" content="LinkGuard is a fast URL shortener. Create custom links, vector QR codes, and track real-time click analytics." />
    <meta property="og:url" content="https://link-guard-blond.vercel.app/" />
    <meta property="og:image" content="https://link-guard-blond.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://link-guard-blond.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LinkGuard Control Room Platform" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LinkGuard — Fast & Secure URL Shortener" />
    <meta name="twitter:description" content="LinkGuard is a fast URL shortener. Create custom links, vector QR codes, and track real-time click analytics." />
    <meta name="twitter:image" content="https://link-guard-blond.vercel.app/og-image.png" />
    <meta name="twitter:creator" content="@LinkGuardApp" />

    <!-- Dynamic Origin Auto-Updater for Local & Alternative Domains -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          if (origin && !origin.includes('link-guard-blond.vercel.app')) {
            var fullImgUrl = origin + '/og-image.png';
            var ogImg = document.querySelector('meta[property="og:image"]');
            var ogImgSec = document.querySelector('meta[property="og:image:secure_url"]');
            var twImg = document.querySelector('meta[name="twitter:image"]');
            var ogUrl = document.querySelector('meta[property="og:url"]');

            if (ogImg) ogImg.setAttribute('content', fullImgUrl);
            if (ogImgSec) ogImgSec.setAttribute('content', fullImgUrl);
            if (twImg) twImg.setAttribute('content', fullImgUrl);
            if (ogUrl) ogUrl.setAttribute('content', origin + '/');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

          "url": "https://link-guard-blond.vercel.app"
        }
      ]
    }
    </script>
