    <!-- Dynamic Origin Auto-Updater for Local & Custom Domains -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          if (origin && !origin.includes('link-guard-two.vercel.app')) {
            var fullImgUrl = origin + '/og-image.webp';
            var ogImg = document.querySelector('meta[property="og:image"]');
            var ogImgSec = document.querySelector('meta[property="og:image:secure_url"]');
            var twImg = document.querySelector('meta[name="twitter:image"]');
            var ogUrl = document.querySelector('meta[property="og:url"]');

            if (ogImg) ogImg.setAttribute('content', fullImgUrl);
            if (ogImgSec) ogImgSec.setAttribute('content', fullImgUrl);
            if (twImg) twImg.setAttribute('content', fullImgUrl);
            if (ogUrl) ogUrl.setAttribute('content', origin + '/');
          }
        } catch (e) {}
      })();
    </script>
