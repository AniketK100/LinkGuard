name: Render Service Keep-Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render Free tier container sleep (sleep starts at 15m inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping to Render Health Check Endpoint
        run: |
          echo "Pinging Render backend health endpoint..."
          set +e
          RESPONSE=$(curl -s -S -w "\n%{http_code}" --max-time 150 --retry 2 --retry-delay 5 --retry-connrefused https://linkguard-5a0l.onrender.com/actuator/health)
          CURL_EXIT=$?
          set -e

          if [ $CURL_EXIT -ne 0 ]; then
            echo "::error::curl network or timeout error (exit code $CURL_EXIT)"
            exit $CURL_EXIT
          fi

          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1 | tr -d '\r\n ')

          echo "Response Body: $HTTP_BODY"
          echo "HTTP Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Keepalive ping failed with HTTP Status Code $HTTP_STATUS"
            exit 1
          fi
