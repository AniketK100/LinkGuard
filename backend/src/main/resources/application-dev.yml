server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:linkguard}
    username: ${DB_USER:linkguard_user}
    password: ${DB_PASSWORD:linkguard_secret}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    root: INFO
    com.linkguard: DEBUG
    org.hibernate.SQL: DEBUG
