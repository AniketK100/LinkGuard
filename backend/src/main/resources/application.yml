server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: linkguard-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:linkguard}
    username: ${DB_USER:linkguard_user}
    password: ${DB_PASSWORD:linkguard_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

jwt:
  secret: ${JWT_SECRET:secretkeymustbeatleast256bitslongforhs256algorithm}
  access-expiration: ${JWT_ACCESS_EXPIRY:900}
  refresh-expiration: ${JWT_REFRESH_EXPIRY:604800}

security:
  ip-hash-salt: ${IP_HASH_SALT:linkguard_ip_anonymization_salt}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.linkguard: DEBUG
    org.hibernate.SQL: WARN
